{% comment %}
Asistente de Axis. Se pinta vacio: el historial se pide solo al abrirlo, para no meter
consultas ni latencia en el render de cada pagina.
{% endcomment %}
<div id="axis-ai" class="axis-ai"
     data-history-url="{% url 'reports:ai_history' %}"
     data-chat-url="{% url 'reports:ai_chat' %}"
     data-memories-url="{% url 'reports:ai_memories' %}"
     data-feedback-url="{% url 'reports:ai_feedback' %}"
     data-files-url="{% url 'reports:ai_attachments' %}"
     data-upload-url="{% url 'reports:ai_attachment_upload' %}"
     data-config-url="{% url 'reports:ai_config_apply' %}">
  <button type="button" class="axis-ai__toggle" aria-expanded="false" aria-controls="axis-ai-panel" title="Asistente de Axis">
    <span class="axis-ai__toggle-icon">&#10022;</span>
    <span class="axis-ai__toggle-text">Asistente</span>
  </button>

  <section id="axis-ai-panel" class="axis-ai__panel" hidden>
    <header class="axis-ai__header">
      <div>
        <strong>Asistente de Axis</strong>
        <span class="axis-ai__usage" data-role="usage"></span>
      </div>
      <div class="axis-ai__actions">
        <button type="button" class="axis-ai__icon" data-role="files-toggle" title="Tus archivos">&#128206;</button>
        <button type="button" class="axis-ai__icon" data-role="memories-toggle" title="Lo que recuerda de ti">&#9776;</button>
        <button type="button" class="axis-ai__close" data-role="close" aria-label="Cerrar">&times;</button>
      </div>
    </header>

    <div class="axis-ai__memories" data-role="memories" hidden>
      <p class="axis-ai__memories-title">Lo que recuerda de ti</p>
      <ul data-role="memories-list"></ul>
    </div>

    <div class="axis-ai__memories" data-role="files" hidden>
      <p class="axis-ai__memories-title">Tus archivos <span data-role="files-hint"></span></p>
      <ul data-role="files-list"></ul>
      <label class="axis-ai__upload">
        <input type="file" data-role="file-input" hidden>
        <span>Subir un archivo</span>
      </label>
    </div>

    <div class="axis-ai__log" data-role="log" aria-live="polite"></div>

    <form class="axis-ai__form" data-role="form">
      <textarea data-role="input" rows="2" maxlength="4000"
                placeholder="Pregunta lo que necesites de Axis..." required></textarea>
      <button type="submit" data-role="send">Enviar</button>
    </form>
  </section>
</div>

<style>
  .axis-ai { position: fixed; right: 24px; bottom: 24px; z-index: 60; font-family: 'Plus Jakarta Sans', sans-serif; }
  .axis-ai__toggle { display: flex; align-items: center; gap: 8px; padding: 12px 18px; border: 1px solid rgba(255,255,255,.12);
    border-radius: 999px; background: linear-gradient(135deg, #6366f1, #8b5cf6); color: #fff; font-size: .85rem;
    font-weight: 600; cursor: pointer; box-shadow: 0 10px 30px rgba(99,102,241,.35); }
  .axis-ai__toggle:hover { filter: brightness(1.08); }
  .axis-ai__toggle-icon { font-size: 1rem; }
  .axis-ai__panel { width: min(400px, calc(100vw - 32px)); height: min(560px, calc(100vh - 120px)); display: flex;
    flex-direction: column; background: #0f172a; border: 1px solid rgba(255,255,255,.1); border-radius: 16px;
    box-shadow: 0 24px 60px rgba(2,6,23,.6); overflow: hidden; }
  .axis-ai__header { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px;
    border-bottom: 1px solid rgba(255,255,255,.08); color: #e2e8f0; font-size: .9rem; }
  .axis-ai__usage { display: block; color: #64748b; font-size: .7rem; margin-top: 2px; }
  .axis-ai__actions { display: flex; align-items: center; gap: 4px; }
  .axis-ai__close, .axis-ai__icon { background: none; border: 0; color: #94a3b8; line-height: 1; cursor: pointer; }
  .axis-ai__close { font-size: 1.4rem; }
  .axis-ai__icon { font-size: 1rem; padding: 4px 6px; border-radius: 6px; }
  .axis-ai__icon:hover, .axis-ai__icon[aria-pressed="true"] { background: rgba(148,163,184,.15); color: #e2e8f0; }
  .axis-ai__memories { border-bottom: 1px solid rgba(255,255,255,.08); padding: 12px 16px; max-height: 190px; overflow-y: auto; }
  .axis-ai__memories-title { margin: 0 0 8px; color: #94a3b8; font-size: .72rem; text-transform: uppercase; letter-spacing: .04em; }
  .axis-ai__memories ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .axis-ai__memories li { display: flex; gap: 8px; align-items: flex-start; color: #cbd5e1; font-size: .76rem; line-height: 1.45; }
  .axis-ai__memories li span { flex: 1; }
  .axis-ai__memories button { background: none; border: 0; color: #64748b; cursor: pointer; font-size: .9rem; line-height: 1; }
  .axis-ai__memories button:hover { color: #fca5a5; }
  .axis-ai__memories--empty { color: #64748b; font-size: .76rem; }
  .axis-ai__load { display: block; margin-top: 4px; padding: 3px 8px; border: 1px solid rgba(99,102,241,.5);
    border-radius: 6px; background: none; color: #a5b4fc; font-size: .68rem; cursor: pointer; }
  .axis-ai__load:hover { background: rgba(99,102,241,.15); }
  .axis-ai__load:disabled { opacity: .5; cursor: default; }
  .axis-ai__memories li a { color: #a5b4fc; text-decoration: none; }
  .axis-ai__memories li a:hover { text-decoration: underline; }
  .axis-ai__memories li small { display: block; color: #64748b; font-size: .68rem; }
  .axis-ai__upload { display: inline-block; margin-top: 10px; padding: 6px 12px; border-radius: 8px;
    border: 1px dashed rgba(148,163,184,.4); color: #94a3b8; font-size: .74rem; cursor: pointer; }
  .axis-ai__upload:hover { border-color: #6366f1; color: #c7d2fe; }
  [data-role="files-hint"] { text-transform: none; letter-spacing: 0; color: #475569; }
  .axis-ai__vote { display: flex; gap: 6px; margin-top: 6px; }
  .axis-ai__vote button { background: none; border: 0; color: #475569; cursor: pointer; font-size: .8rem; padding: 0; }
  .axis-ai__vote button:hover, .axis-ai__vote button[aria-pressed="true"] { color: #a5b4fc; }
  .axis-ai__log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .axis-ai__msg { max-width: 88%; padding: 10px 13px; border-radius: 12px; font-size: .82rem; line-height: 1.5;
    white-space: pre-wrap; word-break: break-word; }
  .axis-ai__msg--user { align-self: flex-end; background: #4f46e5; color: #fff; border-bottom-right-radius: 4px; }
  .axis-ai__msg--assistant { align-self: flex-start; background: #1e293b; color: #e2e8f0; border-bottom-left-radius: 4px; }
  .axis-ai__msg--error { align-self: stretch; background: rgba(239,68,68,.12); border: 1px solid rgba(239,68,68,.35); color: #fca5a5; }
  .axis-ai__msg--hint { align-self: stretch; background: rgba(148,163,184,.08); color: #94a3b8; font-size: .76rem; }
  .axis-ai__form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid rgba(255,255,255,.08); }
  .axis-ai__form textarea { flex: 1; resize: none; background: #131c2e; border: 1px solid rgba(255,255,255,.1);
    border-radius: 10px; padding: 9px 11px; color: #e2e8f0; font-size: .82rem; font-family: inherit; }
  .axis-ai__form button { padding: 0 16px; border: 0; border-radius: 10px; background: #6366f1; color: #fff;
    font-size: .8rem; font-weight: 600; cursor: pointer; }
  .axis-ai__form button:disabled { opacity: .5; cursor: default; }
  @media (max-width: 640px) { .axis-ai { right: 12px; bottom: 12px; } }
</style>

<script>
  (function () {
    const root = document.getElementById('axis-ai');
    if (!root) return;

    const toggle = root.querySelector('.axis-ai__toggle');
    const panel = root.querySelector('.axis-ai__panel');
    const log = root.querySelector('[data-role="log"]');
    const form = root.querySelector('[data-role="form"]');
    const input = root.querySelector('[data-role="input"]');
    const send = root.querySelector('[data-role="send"]');
    const usage = root.querySelector('[data-role="usage"]');
    let historyLoaded = false;
    let filesWhyNot = '';
    let busy = false;

    function csrfToken() {
      const match = document.cookie.match(/(?:^|;\s*)csrftoken=([^;]+)/);
      return match ? decodeURIComponent(match[1]) : '';
    }

    function bubble(role, text) {
      const el = document.createElement('div');
      el.className = 'axis-ai__msg axis-ai__msg--' + role;
      el.textContent = text;
      log.appendChild(el);
      log.scrollTop = log.scrollHeight;
      return el;
    }

    function addVote(el, messageId, current) {
      if (!messageId) return;
      const box = document.createElement('div');
      box.className = 'axis-ai__vote';
      [['up', '▲ Sirvio'], ['down', '▼ No sirvio']].forEach(function (pair) {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.textContent = pair[1];
        btn.setAttribute('aria-pressed', current === pair[0] ? 'true' : 'false');
        btn.addEventListener('click', async function () {
          // Un mismo clic dos veces retira la calificacion.
          const value = btn.getAttribute('aria-pressed') === 'true' ? '' : pair[0];
          await fetch(root.dataset.feedbackUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrfToken() },
            body: JSON.stringify({ message_id: messageId, feedback: value }),
          }).catch(function () {});
          box.querySelectorAll('button').forEach(function (b) { b.setAttribute('aria-pressed', 'false'); });
          if (value) btn.setAttribute('aria-pressed', 'true');
        });
        box.appendChild(btn);
      });
      el.appendChild(box);
    }

    async function loadMemories() {
      const list = root.querySelector('[data-role="memories-list"]');
      list.innerHTML = '';
      try {
        const response = await fetch(root.dataset.memoriesUrl);
        const data = await response.json();
        if (!(data.memories || []).length) {
          const empty = document.createElement('li');
          empty.className = 'axis-ai__memories--empty';
          empty.textContent = 'Todavia no ha guardado nada. Dile "recuerda que..." y lo anota.';
          list.appendChild(empty);
          return;
        }
        data.memories.forEach(function (memory) {
          const item = document.createElement('li');
          const text = document.createElement('span');
          text.textContent = memory.content;
          const drop = document.createElement('button');
          drop.type = 'button';
          drop.title = 'Que lo olvide';
          drop.textContent = '×';
          drop.addEventListener('click', async function () {
            await fetch(root.dataset.memoriesUrl + memory.id + '/forget/', {
              method: 'POST',
              headers: { 'X-CSRFToken': csrfToken() },
            }).catch(function () {});
            item.remove();
          });
          item.appendChild(text);
          item.appendChild(drop);
          list.appendChild(item);
        });
      } catch (error) {
        const failed = document.createElement('li');
        failed.className = 'axis-ai__memories--empty';
        failed.textContent = 'No se pudieron cargar las notas.';
        list.appendChild(failed);
      }
    }

    function showUsage(data) {
      if (!data) return;
      const cost = Number(data.cost_usd || 0).toFixed(4);
      usage.textContent = (data.tokens || 0) + ' tokens hoy · ' + cost + ' USD';
    }

    async function loadHistory() {
      if (historyLoaded) return;
      historyLoaded = true;
      try {
        const response = await fetch(root.dataset.historyUrl, { headers: { 'X-Requested-With': 'fetch' } });
        if (!response.ok) throw new Error('historial');
        const data = await response.json();
        showUsage(data.usage);
        if (!data.enabled) {
          bubble('hint', 'El asistente no esta configurado en este entorno.');
          form.hidden = true;
          return;
        }
        (data.messages || []).forEach(function (m) {
          const el = bubble(m.role === 'user' ? 'user' : 'assistant', m.content);
          if (m.role === 'assistant') addVote(el, m.id, m.feedback);
        });
        if (!(data.messages || []).length) {
          bubble('hint', 'Puedo explicarte como funciona Axis, que significa una metrica o como se calcula algo. Todavia no puedo consultar cifras: si te doy un numero, no confies en el.');
        }
      } catch (error) {
        bubble('error', 'No se pudo cargar el historial.');
      }
    }

    // Cargar es de dos pasos a proposito: primero se simula y se muestra el diff, y solo
    // despues se confirma. Un boton que escribe de una no le da a nadie la oportunidad
    // de ver que iba a pasar.
    async function startImport(file, boton) {
      boton.disabled = true;
      boton.textContent = 'Simulando...';
      try {
        const response = await fetch(root.dataset.filesUrl + file.id + '/preview/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrfToken() },
          body: JSON.stringify({}),
        });
        const data = await response.json().catch(function () { return {}; });
        if (!response.ok) {
          bubble('error', data.detail || 'No se pudo simular la carga.');
          return;
        }
        const p = data.preview;
        const canal = p.cambios.ventas_por_canal;
        bubble('hint',
          'Simulacion de ' + p.archivo + ' (hoja ' + p.hoja + ', ' + p.periodo_del_archivo + '):\n'
          + '· ventas por canal: ' + canal.filas_nuevas + ' filas, ' + canal.cambio_de_monto + ' COP\n'
          + '· ventas por categoria: ' + p.cambios.ventas_por_categoria.filas_nuevas + ' filas\n'
          + 'Nada escrito todavia.');
        if (!data.can_import) {
          bubble('hint', 'No puedes confirmar la carga con tu usuario. ' + (filesWhyNot || ''));
          return;
        }
        askConfirm(file, p);
      } catch (error) {
        bubble('error', 'No se pudo simular la carga.');
      } finally {
        boton.disabled = false;
        boton.textContent = 'Cargar a Axis';
      }
    }

    function askConfirm(file, preview) {
      const caja = bubble('hint', '');
      caja.textContent = '¿Confirmas cargar ' + preview.archivo + ' a Axis? Esto si escribe.';
      const acciones = document.createElement('div');
      acciones.className = 'axis-ai__vote';
      const si = document.createElement('button');
      si.type = 'button';
      si.textContent = 'Si, cargar';
      const no = document.createElement('button');
      no.type = 'button';
      no.textContent = 'Cancelar';
      no.addEventListener('click', function () { acciones.remove(); caja.textContent += ' (cancelado)'; });
      si.addEventListener('click', async function () {
        acciones.remove();
        try {
          const response = await fetch(root.dataset.filesUrl + file.id + '/import/', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrfToken() },
            body: JSON.stringify({ confirm: true, sheet: preview.hoja }),
          });
          const data = await response.json().catch(function () { return {}; });
          if (!response.ok) {
            bubble('error', data.detail || 'No se pudo cargar.');
            return;
          }
          const canal = data.imported.cambios.ventas_por_canal;
          bubble('hint', 'Cargado: ' + canal.filas_nuevas + ' filas de venta, '
            + canal.cambio_de_monto + ' COP. Quedo escrito en Axis.');
        } catch (error) {
          bubble('error', 'No se pudo cargar.');
        }
      });
      acciones.appendChild(si);
      acciones.appendChild(no);
      caja.appendChild(acciones);
    }

    // El boton sale del cambio que la herramienta ya valido, no de lo que el modelo
    // haya escrito en su texto: se confirma exactamente lo que se validó.
    function askConfigConfirm(cambio) {
      const caja = bubble('hint',
        'Cambio de configuracion listo: ' + cambio.target + ' "' + (cambio.name || '') + '" · '
        + cambio.field + ' = ' + cambio.value + '. Nada aplicado todavia.');
      const acciones = document.createElement('div');
      acciones.className = 'axis-ai__vote';
      const si = document.createElement('button');
      si.type = 'button';
      si.textContent = 'Aplicar';
      const no = document.createElement('button');
      no.type = 'button';
      no.textContent = 'Cancelar';
      no.addEventListener('click', function () {
        acciones.remove();
        caja.textContent += ' (cancelado)';
      });
      si.addEventListener('click', async function () {
        acciones.remove();
        try {
          const response = await fetch(root.dataset.configUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrfToken() },
            body: JSON.stringify(Object.assign({ confirm: true }, cambio)),
          });
          const data = await response.json().catch(function () { return {}; });
          if (!response.ok) {
            bubble('error', data.detail || 'No se pudo aplicar el cambio.');
            return;
          }
          const a = data.applied;
          bubble('hint', 'Aplicado: ' + a.objeto + ' · ' + a.campo + ' ' + a.antes + ' -> ' + a.despues);
        } catch (error) {
          bubble('error', 'No se pudo aplicar el cambio.');
        }
      });
      acciones.appendChild(si);
      acciones.appendChild(no);
      caja.appendChild(acciones);
    }

    async function loadFiles() {
      const list = root.querySelector('[data-role="files-list"]');
      const hint = root.querySelector('[data-role="files-hint"]');
      list.innerHTML = '';
      try {
        const response = await fetch(root.dataset.filesUrl);
        const data = await response.json();
        hint.textContent = '· hasta ' + data.max_mb + ' MB · ' + (data.allowed || []).join(' ');
        filesWhyNot = data.why_not_import || '';
        if (!(data.attachments || []).length) {
          const empty = document.createElement('li');
          empty.className = 'axis-ai__memories--empty';
          empty.textContent = 'Todavia no has subido nada. Los archivos siguen aqui en las proximas sesiones.';
          list.appendChild(empty);
          return;
        }
        data.attachments.forEach(function (file) {
          const item = document.createElement('li');
          const wrap = document.createElement('span');
          const link = document.createElement('a');
          link.href = file.url;
          link.textContent = file.name;
          const meta = document.createElement('small');
          meta.textContent = file.size_kb + ' KB · ' + file.uploaded_at.slice(0, 10);
          wrap.appendChild(link);
          wrap.appendChild(meta);
          if (/\.xlsx?$/i.test(file.name)) {
            const cargar = document.createElement('button');
            cargar.type = 'button';
            cargar.className = 'axis-ai__load';
            cargar.textContent = 'Cargar a Axis';
            cargar.addEventListener('click', function () { startImport(file, cargar); });
            wrap.appendChild(cargar);
          }
          const drop = document.createElement('button');
          drop.type = 'button';
          drop.title = 'Quitar de la lista';
          drop.textContent = '×';
          drop.addEventListener('click', async function () {
            await fetch(root.dataset.filesUrl + file.id + '/forget/', {
              method: 'POST',
              headers: { 'X-CSRFToken': csrfToken() },
            }).catch(function () {});
            item.remove();
          });
          item.appendChild(wrap);
          item.appendChild(drop);
          list.appendChild(item);
        });
      } catch (error) {
        const failed = document.createElement('li');
        failed.className = 'axis-ai__memories--empty';
        failed.textContent = 'No se pudieron cargar los archivos.';
        list.appendChild(failed);
      }
    }

    function open() {
      panel.hidden = false;
      toggle.hidden = true;
      toggle.setAttribute('aria-expanded', 'true');
      loadHistory();
      input.focus();
    }

    function close() {
      panel.hidden = true;
      toggle.hidden = false;
      toggle.setAttribute('aria-expanded', 'false');
    }

    toggle.addEventListener('click', open);
    root.querySelector('[data-role="close"]').addEventListener('click', close);

    const memoriesToggle = root.querySelector('[data-role="memories-toggle"]');
    const memoriesBox = root.querySelector('[data-role="memories"]');
    const filesToggle = root.querySelector('[data-role="files-toggle"]');
    const filesBox = root.querySelector('[data-role="files"]');

    function togglePanel(box, button, load, otherBox, otherButton) {
      const showing = !box.hidden;
      box.hidden = showing;
      button.setAttribute('aria-pressed', showing ? 'false' : 'true');
      if (!showing) {
        // Los dos paneles juntos no caben: el chat quedaria en una franja.
        otherBox.hidden = true;
        otherButton.setAttribute('aria-pressed', 'false');
        load();
      }
    }

    memoriesToggle.addEventListener('click', function () {
      togglePanel(memoriesBox, memoriesToggle, loadMemories, filesBox, filesToggle);
    });
    filesToggle.addEventListener('click', function () {
      togglePanel(filesBox, filesToggle, loadFiles, memoriesBox, memoriesToggle);
    });

    root.querySelector('[data-role="file-input"]').addEventListener('change', async function (event) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      event.target.value = '';
      const cuerpo = new FormData();
      cuerpo.append('file', file);
      try {
        const response = await fetch(root.dataset.uploadUrl, {
          method: 'POST',
          headers: { 'X-CSRFToken': csrfToken() },
          body: cuerpo,
        });
        const data = await response.json().catch(function () { return {}; });
        if (!response.ok) {
          bubble('error', data.detail || 'No se pudo subir el archivo.');
          return;
        }
        bubble('hint', (data.already_had_it ? 'Ya tenia ese archivo: ' : 'Archivo guardado: ')
          + data.attachment.name);
        loadFiles();
      } catch (error) {
        bubble('error', 'No se pudo subir el archivo.');
      }
    });

    input.addEventListener('keydown', function (event) {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        form.requestSubmit();
      }
    });

    form.addEventListener('submit', async function (event) {
      event.preventDefault();
      const text = input.value.trim();
      if (!text || busy) return;

      busy = true;
      send.disabled = true;
      input.value = '';
      bubble('user', text);
      const pending = bubble('hint', 'Pensando...');

      try {
        const response = await fetch(root.dataset.chatUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrfToken() },
          body: JSON.stringify({ message: text }),
        });
        const data = await response.json().catch(function () { return {}; });
        pending.remove();
        if (!response.ok) {
          bubble('error', data.detail || 'El asistente no pudo responder.');
        } else {
          const el = bubble('assistant', (data.reply && data.reply.content) || '(sin respuesta)');
          addVote(el, data.reply && data.reply.id, '');
          if (data.remembered) bubble('hint', 'Anotado: ' + data.remembered);
          if (data.pending_change) askConfigConfirm(data.pending_change);
          showUsage(data.usage);
          if (!memoriesBox.hidden) loadMemories();
        }
      } catch (error) {
        pending.remove();
        bubble('error', 'No hubo conexion con el asistente.');
      } finally {
        busy = false;
        send.disabled = false;
        input.focus();
      }
    });
  })();
</script>
