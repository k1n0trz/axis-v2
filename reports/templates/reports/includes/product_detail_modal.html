<style>
  .product-detail-overlay {
    position: fixed;
    inset: 0;
    z-index: 2000;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 1.25rem;
    background: rgba(2, 6, 23, .78);
    backdrop-filter: blur(14px);
  }
  .product-detail-overlay.open { display: flex; }
  .product-detail-dialog {
    width: min(1180px, 100%);
    max-height: min(92vh, 920px);
    overflow: auto;
    border-radius: 22px;
    border: 1px solid rgba(148, 163, 184, .18);
    background:
      radial-gradient(circle at 15% 0%, rgba(59, 130, 246, .16), transparent 35%),
      radial-gradient(circle at 85% 0%, rgba(16, 185, 129, .11), transparent 32%),
      #0b1120;
    box-shadow: 0 28px 90px rgba(0, 0, 0, .52);
  }
  .product-detail-head {
    display: grid;
    grid-template-columns: 190px minmax(0, 1fr) auto;
    gap: 1.2rem;
    padding: 1.35rem;
    border-bottom: 1px solid rgba(148, 163, 184, .12);
  }
  .product-detail-image {
    width: 190px;
    height: 150px;
    border-radius: 18px;
    overflow: hidden;
    background: linear-gradient(135deg, rgba(124, 243, 173, .15), rgba(59, 130, 246, .13));
  }
  .product-detail-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .product-detail-placeholder {
    width: 100%;
    height: 100%;
    display: grid;
    place-content: center;
    font-size: 3rem;
    font-weight: 800;
    color: rgba(248, 250, 252, .78);
  }
  .product-detail-title {
    margin: 0;
    color: #f8fafc;
    font-weight: 800;
    letter-spacing: -.03em;
  }
  .product-detail-subtitle {
    color: #94a3b8;
    font-size: .9rem;
    margin-top: .25rem;
  }
  .product-detail-note {
    margin-top: .8rem;
    color: #facc15;
    font-size: .78rem;
    line-height: 1.45;
  }
  .product-detail-close {
    width: 38px;
    height: 38px;
    border-radius: 12px;
    border: 1px solid rgba(148, 163, 184, .16);
    background: rgba(15, 23, 42, .7);
    color: #e2e8f0;
    font-weight: 800;
  }
  .product-detail-body {
    padding: 1.35rem;
    display: grid;
    gap: 1rem;
  }
  .product-detail-stats {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: .75rem;
  }
  .product-detail-stat {
    border-radius: 15px;
    border: 1px solid rgba(148, 163, 184, .12);
    background: rgba(15, 23, 42, .58);
    padding: .9rem;
  }
  .product-detail-stat small {
    display: block;
    color: #94a3b8;
    font-size: .68rem;
    font-weight: 800;
    text-transform: uppercase;
    margin-bottom: .32rem;
  }
  .product-detail-stat strong {
    color: #f8fafc;
    font-size: 1rem;
  }
  .product-detail-grid {
    display: grid;
    grid-template-columns: minmax(0, 1.35fr) minmax(280px, .65fr);
    gap: 1rem;
  }
  .product-detail-panel {
    border-radius: 18px;
    border: 1px solid rgba(148, 163, 184, .12);
    background: rgba(15, 23, 42, .48);
    padding: 1rem;
  }
  .product-detail-chart {
    height: 360px;
  }
  .product-detail-insights {
    display: grid;
    gap: .7rem;
  }
  .product-detail-insight {
    border-radius: 13px;
    border: 1px solid rgba(16, 185, 129, .18);
    background: rgba(16, 185, 129, .07);
    color: #dbeafe;
    padding: .85rem;
    font-size: .86rem;
    line-height: 1.45;
  }
  .product-detail-loading,
  .product-detail-empty {
    color: #94a3b8;
    text-align: center;
    padding: 2rem;
  }
  .product-detail-trigger {
    cursor: pointer;
  }
  .product-detail-trigger:focus-visible {
    outline: 2px solid rgba(96, 165, 250, .75);
    outline-offset: 3px;
  }
  @media (max-width: 992px) {
    .product-detail-head,
    .product-detail-grid {
      grid-template-columns: 1fr;
    }
    .product-detail-image {
      width: 100%;
      height: 220px;
    }
    .product-detail-stats {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
  }
  @media (max-width: 640px) {
    .product-detail-stats { grid-template-columns: 1fr; }
  }
</style>

<div class="product-detail-overlay" id="productDetailOverlay" aria-hidden="true">
  <div class="product-detail-dialog" role="dialog" aria-modal="true" aria-labelledby="productDetailTitle">
    <div class="product-detail-head">
      <div class="product-detail-image" id="productDetailImage"></div>
      <div>
        <h2 class="product-detail-title" id="productDetailTitle">Detalle de producto</h2>
        <div class="product-detail-subtitle" id="productDetailSubtitle"></div>
        <div class="product-detail-note" id="productDetailNote"></div>
      </div>
      <button type="button" class="product-detail-close" id="productDetailClose" aria-label="Cerrar">x</button>
    </div>
    <div class="product-detail-body">
      <div class="product-detail-loading" id="productDetailLoading">Cargando detalle...</div>
      <div class="product-detail-stats" id="productDetailStats"></div>
      <div class="product-detail-grid" id="productDetailContent">
        <div class="product-detail-panel">
          <div class="section-title mb-2">Ventas, inversion, ROAS y ticket</div>
          <div class="product-detail-chart"><canvas id="productDetailChart"></canvas></div>
        </div>
        <div class="product-detail-panel">
          <div class="section-title mb-3">Insights clave</div>
          <div class="product-detail-insights" id="productDetailInsights"></div>
        </div>
      </div>
    </div>
  </div>
</div>
