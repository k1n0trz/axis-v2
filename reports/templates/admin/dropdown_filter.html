<h3>{{ title }}</h3>
<select class="admin-filter-select" aria-label="{{ title }}" onchange="if (this.value) { window.location = this.value; }">
  {% for choice in choices %}
    <option value="{{ choice.query_string|iriencode }}" {% if choice.selected %}selected{% endif %}>
      {{ choice.display }}
    </option>
  {% endfor %}
</select>
